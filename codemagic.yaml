workflows:
  ios-testflight:
    name: Shree Ram Fitness - iOS TestFlight
    max_build_duration: 60
    working_directory: mobile
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic  # rename to match the integration name you create in Codemagic > Team settings > Integrations > Apple Developer Portal
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.gymapp.gymApp
      groups:
        - app_config  # add API_BASE_URL here (Codemagic > Team settings > Environment variable groups)
      vars:
        XCODE_WORKSPACE: "Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install Flutter dependencies
        script: flutter packages pub get
      - name: Set up code signing
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          flutter build ipa --release --dart-define=API_BASE_URL="$API_BASE_URL"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-release:
    name: Shree Ram Fitness - Android Release
    max_build_duration: 30
    working_directory: mobile
    instance_type: linux_x2
    environment:
      groups:
        - app_config  # add API_BASE_URL here
      flutter: stable
    scripts:
      - name: Install Flutter dependencies
        script: flutter packages pub get
      - name: Build APK
        script: flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
